<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="跨机型嵌入式五层软件架构图">
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
    </style>
    <filter id="shadow" x="-3%" y="-12%" width="106%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <!-- Header -->
  <text class="t" x="50" y="58" font-size="28" font-weight="700" fill="#1f2328">跨机型嵌入式五层软件架构</text>
  <text class="t" x="50" y="88" font-size="14" fill="#57606a">STM32F4 / H7 按需链接 · CMake 多仓 · 业务代码零芯片头文件</text>
  <rect x="748" y="38" width="202" height="34" rx="17" fill="#ddf4ff"/>
  <text class="t" x="849" y="60" font-size="12" font-weight="600" fill="#0969da" text-anchor="middle">Git 多仓 · 双档 CI 门禁</text>

  <!-- Layer 1 : APP -->
  <g>
    <rect x="50" y="120" width="900" height="90" rx="12" fill="#f0f7ff" stroke="#b6d7fa" filter="url(#shadow)"/>
    <rect x="50" y="121" width="6" height="88" rx="3" fill="#0969da"/>
    <circle cx="92" cy="165" r="19" fill="#0969da"/>
    <text class="t" x="92" y="171" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text class="t" x="124" y="161" font-size="18" font-weight="700" fill="#1f2328">APP 层</text>
    <text class="t" x="124" y="182" font-size="11" fill="#656d76">Application · FreeRTOS Tasks</text>
    <line x1="300" y1="138" x2="300" y2="192" stroke="#d0d7de"/>
    <g class="t" font-size="13" fill="#1f2328" text-anchor="middle">
      <rect x="320" y="147" width="76" height="36" rx="6" fill="#ffffff" stroke="#0969da" stroke-opacity="0.45"/><text x="358" y="170">云台任务</text>
      <rect x="406" y="147" width="76" height="36" rx="6" fill="#ffffff" stroke="#0969da" stroke-opacity="0.45"/><text x="444" y="170">底盘任务</text>
      <rect x="492" y="147" width="90" height="36" rx="6" fill="#ffffff" stroke="#0969da" stroke-opacity="0.45"/><text x="537" y="170">机械臂任务</text>
      <rect x="592" y="147" width="104" height="36" rx="6" fill="#ffffff" stroke="#0969da" stroke-opacity="0.45"/><text x="644" y="170">自定义控制器</text>
    </g>
    <line x1="730" y1="138" x2="730" y2="192" stroke="#d0d7de"/>
    <text class="t" x="750" y="160" font-size="12" fill="#57606a">业务逻辑与任务划分</text>
    <text class="t" x="750" y="180" font-size="12" fill="#57606a">实时控制调度</text>
  </g>

  <!-- Layer 2 : Module -->
  <g>
    <rect x="50" y="222" width="900" height="90" rx="12" fill="#f8f2ff" stroke="#d8b9ff" filter="url(#shadow)"/>
    <rect x="50" y="223" width="6" height="88" rx="3" fill="#8250df"/>
    <circle cx="92" cy="267" r="19" fill="#8250df"/>
    <text class="t" x="92" y="273" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text class="t" x="124" y="263" font-size="18" font-weight="700" fill="#1f2328">Module 层</text>
    <text class="t" x="124" y="284" font-size="11" fill="#656d76">Algorithm · Protocol · Driver · Tools</text>
    <line x1="300" y1="240" x2="300" y2="294" stroke="#d0d7de"/>
    <g class="t" font-size="13" fill="#1f2328" text-anchor="middle">
      <rect x="320" y="249" width="76" height="36" rx="6" fill="#ffffff" stroke="#8250df" stroke-opacity="0.45"/><text x="358" y="272">控制算法</text>
      <rect x="406" y="249" width="100" height="36" rx="6" fill="#ffffff" stroke="#8250df" stroke-opacity="0.45"/><text x="456" y="272">5 类电机协议</text>
      <rect x="516" y="249" width="86" height="36" rx="6" fill="#ffffff" stroke="#8250df" stroke-opacity="0.45"/><text x="559" y="272">双遥控器</text>
      <rect x="612" y="249" width="86" height="36" rx="6" fill="#ffffff" stroke="#8250df" stroke-opacity="0.45"/><text x="655" y="272">通用工具库</text>
    </g>
    <line x1="730" y1="240" x2="730" y2="294" stroke="#d0d7de"/>
    <text class="t" x="750" y="262" font-size="12" fill="#57606a">四类模块跨机型复用</text>
    <text class="t" x="750" y="282" font-size="12" fill="#57606a">Git 多仓独立维护</text>
  </g>

  <!-- Layer 3 : BSP -->
  <g>
    <rect x="50" y="324" width="900" height="90" rx="12" fill="#f0fff4" stroke="#aceebb" filter="url(#shadow)"/>
    <rect x="50" y="325" width="6" height="88" rx="3" fill="#1a7f37"/>
    <circle cx="92" cy="369" r="19" fill="#1a7f37"/>
    <text class="t" x="92" y="375" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text class="t" x="124" y="365" font-size="18" font-weight="700" fill="#1f2328">总线抽象层</text>
    <text class="t" x="124" y="386" font-size="11" fill="#656d76">BSP · Bus Abstraction</text>
    <line x1="300" y1="342" x2="300" y2="396" stroke="#d0d7de"/>
    <g class="t" font-size="13" fill="#1f2328" text-anchor="middle">
      <rect x="320" y="351" width="100" height="36" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-opacity="0.45"/><text x="370" y="374">CAN / FDCAN</text>
      <rect x="430" y="351" width="64" height="36" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-opacity="0.45"/><text x="462" y="374">UART</text>
      <rect x="504" y="351" width="58" height="36" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-opacity="0.45"/><text x="533" y="374">SPI</text>
      <rect x="572" y="351" width="58" height="36" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-opacity="0.45"/><text x="601" y="374">I2C</text>
    </g>
    <line x1="730" y1="342" x2="730" y2="396" stroke="#d0d7de"/>
    <text class="t" x="750" y="364" font-size="12" fill="#57606a">统一外设访问接口</text>
    <text class="t" x="750" y="384" font-size="12" fill="#57606a">屏蔽总线差异</text>
  </g>

  <!-- Layer 4 : Chip Adapter -->
  <g>
    <rect x="50" y="426" width="900" height="90" rx="12" fill="#fff9e6" stroke="#f2d98c" filter="url(#shadow)"/>
    <rect x="50" y="427" width="6" height="88" rx="3" fill="#bf8700"/>
    <circle cx="92" cy="471" r="19" fill="#bf8700"/>
    <text class="t" x="92" y="477" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text class="t" x="124" y="467" font-size="18" font-weight="700" fill="#1f2328">芯片适配层</text>
    <text class="t" x="124" y="488" font-size="11" fill="#656d76">Chip Adapter</text>
    <line x1="300" y1="444" x2="300" y2="498" stroke="#d0d7de"/>
    <g class="t" font-size="13" fill="#1f2328" text-anchor="middle">
      <rect x="320" y="453" width="86" height="36" rx="6" fill="#ffffff" stroke="#bf8700" stroke-opacity="0.5"/><text x="363" y="476">F4 适配</text>
      <rect x="416" y="453" width="86" height="36" rx="6" fill="#ffffff" stroke="#bf8700" stroke-opacity="0.5"/><text x="459" y="476">H7 适配</text>
      <rect x="512" y="453" width="100" height="36" rx="6" fill="#ffffff" stroke="#bf8700" stroke-opacity="0.5"/><text x="562" y="476">寄存器映射</text>
    </g>
    <line x1="730" y1="444" x2="730" y2="498" stroke="#d0d7de"/>
    <text class="t" x="750" y="466" font-size="12" fill="#57606a">吸收 F4 / H7 硬件差异</text>
    <text class="t" x="750" y="486" font-size="12" fill="#57606a">业务层零芯片头文件</text>
  </g>

  <!-- Layer 5 : Hardware -->
  <g>
    <rect x="50" y="528" width="900" height="90" rx="12" fill="#f6f8fa" stroke="#d0d7de" filter="url(#shadow)"/>
    <rect x="50" y="529" width="6" height="88" rx="3" fill="#57606a"/>
    <circle cx="92" cy="573" r="19" fill="#57606a"/>
    <text class="t" x="92" y="579" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text class="t" x="124" y="569" font-size="18" font-weight="700" fill="#1f2328">硬件 / HAL</text>
    <text class="t" x="124" y="590" font-size="11" fill="#656d76">Hardware</text>
    <line x1="300" y1="546" x2="300" y2="600" stroke="#d0d7de"/>
    <g class="t" font-size="13" fill="#1f2328" text-anchor="middle">
      <rect x="320" y="555" width="92" height="36" rx="6" fill="#ffffff" stroke="#8c959f" stroke-opacity="0.6"/><text x="366" y="578">STM32F4</text>
      <rect x="422" y="555" width="92" height="36" rx="6" fill="#ffffff" stroke="#8c959f" stroke-opacity="0.6"/><text x="468" y="578">STM32H7</text>
      <rect x="524" y="555" width="120" height="36" rx="6" fill="#ffffff" stroke="#8c959f" stroke-opacity="0.6"/><text x="584" y="578">传感器 / 执行器</text>
    </g>
    <line x1="730" y1="546" x2="730" y2="600" stroke="#d0d7de"/>
    <text class="t" x="750" y="568" font-size="12" fill="#57606a">4 台机器 / 10 个工程</text>
    <text class="t" x="750" y="588" font-size="12" fill="#57606a">按需链接复用层</text>
  </g>

  <!-- Footer -->
  <line x1="50" y1="642" x2="950" y2="642" stroke="#d0d7de"/>
  <text class="t" x="50" y="668" font-size="12" font-weight="700" fill="#0969da">关键结果</text>
  <text class="t" x="130" y="668" font-size="12" fill="#57606a">5 类电机协议与双遥控器在 F4 / H7 零改动复用 · SHA256 扫描 144 组同名文件定收敛顺序</text>
  <text class="t" x="130" y="692" font-size="12" fill="#57606a">零重构迁移 20+ 逐字节相同文件 · SIL 回归 + 分层依赖检查 + 双档 CI 质量门禁</text>
</svg>
